# Hygon mirror CI: format / static checks only (self-hosted, no GPU).
# Upstream full CI lives on tile-ai/tilelang (.github/workflows/ci.yml).
name: Lint

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDEVMODE: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ""
  PIP_USER: ""
  COLUMNS: "100"
  FORCE_COLOR: "1"
  CLICOLOR_FORCE: "1"
  XDG_CACHE_HOME: ${{ github.workspace }}/.cache
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
  PRE_COMMIT_HOME: ${{ github.workspace }}/.cache/pip/.pre-commit

jobs:
  quick-lint:
    name: Quick Lint
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Lint excludes 3rdparty/; no submodule fetch needed.

      - name: Select Python interpreters
        id: python
        run: |
          PYTHON39="$(command -v python3.9)"
          PYTHON312="$(command -v python3.12)"
          "${PYTHON39}" --version
          "${PYTHON312}" --version
          echo "python39-path=${PYTHON39}" >> "${GITHUB_OUTPUT}"
          echo "python312-path=${PYTHON312}" >> "${GITHUB_OUTPUT}"

      - name: Check AST with Python 3.9
        run: |
          "${{ steps.python.outputs.python39-path }}" -m compileall -q -f tilelang

      - name: Pre-commit Lint
        run: |
          PY312="${{ steps.python.outputs.python312-path }}"
          export PATH="${HOME}/.local/bin:${PATH}"
          if ! "${PY312}" -m pip --version >/dev/null 2>&1; then
            "${PY312}" -m ensurepip --user --upgrade
          fi
          "${PY312}" -m pip install --user pre-commit
          if ! "${PY312}" -m pre_commit run --all-files --color=always --show-diff-on-failure; then
            echo "::error::Pre-commit checks failed. Run 'pre-commit run --all-files' locally."
            exit 1
          fi

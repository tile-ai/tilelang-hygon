# Hygon HCU self-hosted CI (opt-in).
#
# Aligns with GitLab (.gitlab-ci.yml): nmz runner + dev base image, das-build.sh, wheel install.
# GitLab does not set `image:` in-repo; runner tag `nmz` binds the same Harbor dev image.
#
# Branch gating via repo variables HCU_CI_PUSH_BRANCHES / HCU_CI_PR_BASE_BRANCHES
# (comma-separated). workflow_dispatch always runs.
# Job container must include --privileged (hy-smi/CIsmi). Do not pass --network=host
# (conflicts with GHA github_network_*).
name: HCU CI

on:
  workflow_dispatch:
    inputs:
      install_project:
        description: Build tilelang wheel and install before tests
        type: boolean
        required: false
        default: true
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:

permissions:
  contents: read

concurrency:
  group: hcu-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDEVMODE: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ""
  COLUMNS: "100"
  FORCE_COLOR: "1"
  CLICOLOR_FORCE: "1"
  TILELANG_TARGET: hip
  # Match GitLab CI variables (.gitlab-ci.yml); infra URLs from repo variables
  PIP_INDEX_URL: ${{ vars.HCU_PIP_INDEX_URL }}
  PIP_TRUSTED_HOST: ${{ vars.HCU_PIP_TRUSTED_HOST }}
  PKG_BASE_URL: ${{ vars.HCU_PKG_BASE_URL }}
  DTK_VERSION: "dtk26.04"
  DTK_PKG_NAME: "DTK-26.04-rc4-centos8-x86_64.tar.gz"
  TORCH_VERSION: "2.10.0"
  CISMI_TIMEOUT: "3600"
  TILEKERNELS_REF: "staging"
  TILEKERNELS_DIR: "/opt/TileKernels"
  XDG_CACHE_HOME: ${{ github.workspace }}/.cache
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip

jobs:
  hcu-tests:
    name: HCU Tests
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        vars.HCU_CI_PUSH_BRANCHES != '' &&
        contains(format(',{0},', vars.HCU_CI_PUSH_BRANCHES), format(',{0},', github.ref_name))) ||
      (github.event_name == 'pull_request' &&
        vars.HCU_CI_PR_BASE_BRANCHES != '' &&
        contains(format(',{0},', vars.HCU_CI_PR_BASE_BRANCHES), format(',{0},', github.base_ref)))
    runs-on: nmz4-test
    timeout-minutes: 180
    container:
      image: ${{ vars.HCU_DEV_CONTAINER_IMAGE }}
      # --privileged required for hy-smi/CIsmi; verified on nmz27 Harbor image + bridge network
      options: --privileged --ipc=host --shm-size=64g --group-add=video --cap-add=SYS_PTRACE --security-opt seccomp=unconfined --ulimit stack=-1:-1 --ulimit memlock=-1:-1 --device=/dev/kfd --device=/dev/dri -v /usr/local/hyhal:/usr/local/hyhal:ro -v /opt/hyhal:/opt/hyhal:ro
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install DTK
        run: |
          export_dtk_env() {
            # shellcheck disable=SC1091
            source /opt/dtk/env.sh
            {
              echo "PATH=${PATH}"
              echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}"
              echo "ROCM_PATH=${ROCM_PATH:-/opt/dtk}"
              echo "USE_ROCM=ON"
              echo "HIP_PATH=${HIP_PATH:-/opt/dtk/hip}"
              echo "HYHAL_PATH=${HYHAL_PATH:-/opt/hyhal}"
              [[ -n "${CPLUS_INCLUDE_PATH:-}" ]] && echo "CPLUS_INCLUDE_PATH=${CPLUS_INCLUDE_PATH}"
              [[ -n "${C_INCLUDE_PATH:-}" ]] && echo "C_INCLUDE_PATH=${C_INCLUDE_PATH}"
              [[ -n "${CMAKE_PREFIX_PATH:-}" ]] && echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}"
              [[ -n "${LIBRARY_PATH:-}" ]] && echo "LIBRARY_PATH=${LIBRARY_PATH}"
            } >> "${GITHUB_ENV}"
          }

          install_dtk_from_tar() {
            local tar_path="$1"
            cp -f "${tar_path}" /opt/ || mv "${tar_path}" /opt/
            cd /opt && tar -xzf "$(basename "${tar_path}")" && mv dtk-* dtk
            export_dtk_env
          }

          local_archived="/ArchivedFile/dtk-pkg/${DTK_VERSION}/${DTK_PKG_NAME}"
          if [[ -f "${local_archived}" ]]; then
            echo "Using local DTK: ${local_archived}"
            install_dtk_from_tar "${local_archived}"
          elif [[ -f /opt/dtk/env.sh ]]; then
            echo "Using existing /opt/dtk"
            export_dtk_env
          else
            dtk_url="${PKG_BASE_URL}/dtk-pkg/${DTK_VERSION}/${DTK_PKG_NAME}"
            echo "Downloading DTK from ${dtk_url}"
            curl -fL --retry 3 --retry-delay 5 -o "/tmp/${DTK_PKG_NAME}" "${dtk_url}"
            install_dtk_from_tar "/tmp/${DTK_PKG_NAME}"
          fi

      - name: Install AICC
        run: |
          install_aicc_run() {
            local run_file="$1"
            cp "${run_file}" ./
            chmod +x "$(basename "${run_file}")"
            yes | bash "$(basename "${run_file}")"
            echo "AICC install done: $(basename "${run_file}")"
          }

          aicc_base="${PKG_BASE_URL}/ai_cc/nightly"
          latest_run=$(curl -fsSL "${aicc_base}/" | grep -oE 'dtk_llvm_[^"]+\.run' | sort -u | sort -t '_' -k4 -nr | head -n1)
          if [[ -z "${latest_run}" ]]; then
            echo "Skip AICC install (no dtk_llvm_*.run on ${aicc_base})"
            exit 0
          fi
          echo "Downloading AICC: ${aicc_base}/${latest_run}"
          curl -fL --retry 3 --retry-delay 5 -o "/tmp/${latest_run}" "${aicc_base}/${latest_run}"
          install_aicc_run "/tmp/${latest_run}"

      - name: Sync submodules
        run: |
          for i in $(seq 0 9); do
            echo "submodule sync attempt ${i}"
            git submodule sync --recursive
            if git submodule update --init --recursive; then
              echo "download submodule success"
              break
            fi
            if [[ "${i}" -eq 9 ]]; then
              echo "::error::Failed to sync submodules after 10 attempts"
              exit 1
            fi
            sleep 5
          done
          test -f 3rdparty/tvm/CMakeLists.txt

      - name: Install dependencies and build
        run: |
          set -o pipefail
          echo "PY=$(command -v python3)" >> "${GITHUB_ENV}"
          python3 --version
          pip3 install --upgrade pip setuptools wheel
          # GitLab test job order (.gitlab-ci.yml)
          pip3 install "torch==${TORCH_VERSION}" triton==3.6.0 cismi hcusmi
          # Generic deps from public mirror (avoid slow/missing pkgs on internal devpi)
          pip3 install -r requirements.txt -r requirements-dev.txt \
            --index-url https://mirrors.aliyun.com/pypi/simple/ \
            --trusted-host mirrors.aliyun.com
          python3 -c "import z3; print('z3:', z3.__path__[0])"
          INSTALL_PROJECT=true
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.install_project }}" != "true" ]]; then
            INSTALL_PROJECT=false
          fi
          if [[ "${INSTALL_PROJECT}" == "true" ]]; then
            # shellcheck disable=SC1091
            [[ -f /opt/dtk/env.sh ]] && source /opt/dtk/env.sh
            export USE_HCU=ON
            export USE_CUDA=OFF
            export LD_LIBRARY_PATH="/opt/rocm/lib:${LD_LIBRARY_PATH:-}"
            test -f /opt/dtk/include/hsa/hsa.h || test -f /opt/hyhal/include/hsa/hsa.h
            NO_TOOLCHAIN_VERSION=1 NO_GIT_VERSION=1 bash das-build.sh
            pip3 install dist/*.whl
          fi
          # GitLab test job: regression deps (not full requirements-test.txt)
          pip3 install numpy==1.24.3 allure-pytest pytest-xdist \
            --index-url https://mirrors.aliyun.com/pypi/simple/ \
            --trusted-host mirrors.aliyun.com
          python3 -c "import torch; print('torch:', torch.__version__)"
          python3 -m torch.utils.collect_env || true

      - name: Clean stale /tmp artifacts
        run: |
          rm -f /tmp/tmp*.so /tmp/tmp*.cu /tmp/tmp*.cubin /tmp/tmp*.cpp
          rm -rf /tmp/tvm-debug-mode-tempdirs /tmp/tilelang_cutedsl_*

      - name: Clone TileKernels
        run: |
          rm -rf "${TILEKERNELS_DIR}"
          if [[ -z "${{ secrets.TILEKERNELS_GITHUB_TOKEN }}" ]]; then
            echo "::error::TILEKERNELS_GITHUB_TOKEN secret is required to clone HYGON-AI/TileKernels-das"
            exit 1
          fi
          git clone -b "${TILEKERNELS_REF}" \
            "https://x-access-token:${{ secrets.TILEKERNELS_GITHUB_TOKEN }}@github.com/HYGON-AI/TileKernels-das.git" \
            "${TILEKERNELS_DIR}"

      - name: Acquire GPU
        run: |
          set -eo pipefail
          # shellcheck disable=SC1091
          [[ -f /opt/dtk/env.sh ]] && source /opt/dtk/env.sh
          echo "Waiting for 1 GPU via CIsmi (timeout=${CISMI_TIMEOUT}s)..."
          if acquired="$(CIsmi need 1 --timeout "${CISMI_TIMEOUT}")"; then
            echo "CIsmi allocated GPU(s): ${acquired}"
          else
            echo "::error::CIsmi need 1 failed (hy-smi JSON/device access). Check runner ROCm/CIsmi on host."
            exit 1
          fi
          echo "HIP_VISIBLE_DEVICES=${acquired}" >> "${GITHUB_ENV}"
          echo "Acquired HIP_VISIBLE_DEVICES=${acquired}"
          if command -v hy-smi >/dev/null 2>&1; then
            hy-smi || true
          elif command -v rocm-smi >/dev/null 2>&1; then
            rocm-smi || true
          fi
          python3 -c "import torch; assert torch.cuda.is_available(), 'torch.cuda.is_available() is False'"

      - name: Run das-regression
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          [[ -f /opt/dtk/env.sh ]] && source /opt/dtk/env.sh
          mkdir -p "${GITHUB_WORKSPACE}/das-results/allure-results"
          : "${HIP_VISIBLE_DEVICES:?HIP_VISIBLE_DEVICES must be set by Acquire GPU step}"
          REPO_DIR="${TILEKERNELS_DIR}" \
            TILELANG_REPO_DIR="${GITHUB_WORKSPACE}" \
            TILELANG_CACHE_DIR="${GITHUB_WORKSPACE}/cache_test" \
            TEST_RESULTS_DIR="${GITHUB_WORKSPACE}/das-results" \
            GENERATE_ALLURE_REPORT=1 \
            bash das-regression.sh --junitxml="${GITHUB_WORKSPACE}/das-results/allure-results/results.xml"

      - name: List generated files
        if: ${{ !cancelled() }}
        run: |
          find . -type f -name '*.py[co]' -delete
          find . -depth -type d -name __pycache__ -exec rm -r "{}" +
          git status --ignored --porcelain || true

# Hygon HCU nightly wheel publish (self-hosted), mirroring the GitLab `publish`
# job of .gitlab-ci.yml:
#
#   push to a release branch
#     -> build one wheel per (DTK image x torch version)          [das-build.sh]
#     -> CIUpload REPAIR: rewrite version to
#        <base>+dtk<dtk>.torch<torch>.<ts>.g<commit> and pin torch==<torch>
#     -> CIUpload NIGHTLY: upload to the internal devpi nightly index
#        (das_nightly/dtk<dtk>) and record the release on DashHub
#
# GitLab runs these jobs in the DTK image picked by the `nmz` runner and gets
# $PYPI_URL from project CI variables; here the matrix supplies the image tag
# and the same values come from repository variables, so nothing internal is
# hardcoded in this file.
#
# Required repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   HCU_DTK_IMAGE_PREFIX    Harbor path prefix of the DTK build images, without tag,
#                           e.g. <registry>/hcu/base/dtk -- matrix supplies the tag
#   HCU_PYPI_URL            Internal devpi base URL, e.g. http://<host>:9929
#                           (the job derives ${HCU_PYPI_URL}/nightly/dtk<ver>/+simple/)
#   HCU_PKG_BASE_URL        Archival server that serves ai_cc/Nightly (AICC installer)
# Optional variables:
#   HCU_PUBLISH_RUNNER      Runner label, default nmz4-test (same as HCU CI)
#   HCU_PUBLISH_RECORD      "0" disables DashHub recording (default: record)
#
# Required repository secret:
#   HCU_DEVPI_NIGHTLY_PASSWORD   devpi password of the nightly uploader account
#
# Branch gating mirrors GitLab `.publish_rules` (push to release/*) and also
# covers this repository's vX.Y.Z-release naming. workflow_dispatch always
# runs, so a maintainer can re-publish a branch or verify the build without
# uploading (`publish=false`).
name: HCU Publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the repaired wheels to the devpi nightly index
        type: boolean
        required: false
        default: true
  push:
    branches:
      - "release/**"
      - "*-release"

permissions:
  contents: read
  # CIUpload's DashHub recorder reads the commit's PR and check-runs for test stats.
  pull-requests: read
  checks: read

concurrency:
  group: hcu-publish-${{ github.ref }}
  # Never cancel a half-finished build: an interrupted upload leaves a
  # partially published version on the index.
  cancel-in-progress: false

env:
  PYTHONDEVMODE: "1"
  PYTHONUNBUFFERED: "1"
  COLUMNS: "100"
  FORCE_COLOR: "1"
  CLICOLOR_FORCE: "1"
  # Filled in below once the DTK version is known (mirrors .gitlab-ci.yml).
  PYPI_URL: ${{ vars.HCU_PYPI_URL }}
  PKG_BASE_URL: ${{ vars.HCU_PKG_BASE_URL }}
  XDG_CACHE_HOME: ${{ github.workspace }}/.cache
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip

jobs:
  publish:
    name: publish · dtk${{ matrix.dtk_series }} · torch ${{ matrix.torch_version }}
    runs-on: ${{ vars.HCU_PUBLISH_RUNNER || 'nmz4-test' }}
    timeout-minutes: 240
    container:
      image: ${{ vars.HCU_DTK_IMAGE_PREFIX }}:${{ matrix.dtk_tag }}
      # Same container options as ci-hcu.yml; the runner host is an HCU node.
      options: --privileged --ipc=host --shm-size=64g --group-add=video --cap-add=SYS_PTRACE --security-opt seccomp=unconfined --ulimit stack=-1:-1 --ulimit memlock=-1:-1 --device=/dev/kfd --device=/dev/dri -v /usr/local/hyhal:/usr/local/hyhal:ro -v /opt/hyhal:/opt/hyhal:ro
    env:
      # Job level so the matrix context is available.
      TORCH_VERSION: ${{ matrix.torch_version }}
    strategy:
      # One broken (DTK, torch) pair must not cancel the other uploads.
      fail-fast: false
      matrix:
        # Matrix of .gitlab-ci.yml `publish.parallel.matrix`:
        #   26.04 -> torch 2.10.0 / 2.11.0, 26.10 -> torch 2.11.0
        include:
          - dtk_series: "26.04"
            dtk_tag: "26.04-rockylinux8.6-py3.10"
            torch_version: "2.10.0"
          - dtk_series: "26.04"
            dtk_tag: "26.04-rockylinux8.6-py3.10"
            torch_version: "2.11.0"
          - dtk_series: "26.10"
            dtk_tag: "26.10-rockylinux8.6-py3.12"
            torch_version: "2.11.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Full history + submodules, as GitLab GIT_SUBMODULE_STRATEGY=recursive.
          fetch-depth: 0
          submodules: recursive

      - name: Prepare DTK environment
        run: |
          set -eo pipefail
          # DTK ships inside the build image; only the environment is loaded.
          # shellcheck disable=SC1091
          source /opt/dtk/env.sh
          {
            echo "PATH=${PATH}"
            echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}"
            echo "ROCM_PATH=${ROCM_PATH:-/opt/dtk}"
            echo "USE_ROCM=ON"
            echo "HIP_PATH=${HIP_PATH:-/opt/dtk/hip}"
            echo "HYHAL_PATH=${HYHAL_PATH:-/opt/hyhal}"
            for var in CPLUS_INCLUDE_PATH C_INCLUDE_PATH CMAKE_PREFIX_PATH LIBRARY_PATH; do
              if [[ -n "${!var:-}" ]]; then
                echo "${var}=${!var}"
              fi
            done
          } >> "${GITHUB_ENV}"

          # DTK series, e.g. 26.04 -> 2604 (.gitlab-ci.yml: tr -d '.'; keep the
          # first two components so a 26.04.1 build suffix cannot leak in).
          DTK_VER="$(head -n1 /opt/dtk/.info/version-dev | cut -d. -f1,2 | tr -d '.')"
          if [[ ! "${DTK_VER}" =~ ^[0-9]{4}$ ]]; then
            echo "::error::Cannot derive DTK series from /opt/dtk/.info/version-dev (got '${DTK_VER}')"
            exit 1
          fi

          : "${PYPI_URL:?HCU_PYPI_URL repository variable is required}"
          PYPI_URL="${PYPI_URL%/}"
          PIP_INDEX_URL="${PYPI_URL}/nightly/dtk${DTK_VER}/+simple/"
          PIP_TRUSTED_HOST="$(sed -E 's#^https?://##; s#[:/].*##' <<< "${PYPI_URL}")"

          {
            echo "DTK_VER=${DTK_VER}"
            echo "PYPI_URL=${PYPI_URL}"
            echo "PIP_INDEX_URL=${PIP_INDEX_URL}"
            echo "PIP_TRUSTED_HOST=${PIP_TRUSTED_HOST}"
          } >> "${GITHUB_ENV}"

          echo "DTK_VER=${DTK_VER}"
          echo "PIP_INDEX_URL=${PIP_INDEX_URL}"
          echo "PIP_TRUSTED_HOST=${PIP_TRUSTED_HOST}"
          echo "TORCH_VERSION=${TORCH_VERSION}"
          python3 --version

      - name: Install AICC
        run: |
          set -eo pipefail
          # .gitlab-ci.yml: public installer script, 2604 -> AICC 1.0.0,
          # 2610 (and later) -> 2.0.0.
          : "${PKG_BASE_URL:?HCU_PKG_BASE_URL repository variable is required}"
          installer_url="${PKG_BASE_URL%/}/ai_cc/Nightly/hcu_llvm_installer.sh"
          echo "Downloading AICC installer: ${installer_url}"
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/hcu_llvm_installer.sh "${installer_url}"
          case "${DTK_VER}" in
            2604) AICC_MAJOR=1.0.0 ;;
            *)    AICC_MAJOR=2.0.0 ;;
          esac
          echo "Installing AICC ${AICC_MAJOR} for dtk${DTK_VER}"
          bash /tmp/hcu_llvm_installer.sh --major "${AICC_MAJOR}"

      - name: Sync submodules
        run: |
          set -eo pipefail
          for i in $(seq 0 9); do
            echo "submodule sync attempt ${i}"
            git submodule sync --recursive
            if git submodule update --init --recursive; then
              echo "download submodule success"
              break
            fi
            if [[ "${i}" -eq 9 ]]; then
              echo "::error::Failed to sync submodules after 10 attempts"
              exit 1
            fi
            sleep 5
          done
          test -f 3rdparty/tvm/CMakeLists.txt

      - name: Build wheel
        run: |
          set -eo pipefail
          echo "DTK_VER=${DTK_VER} TORCH_VERSION=${TORCH_VERSION}"
          echo "PIP_INDEX_URL=${PIP_INDEX_URL}"
          python3 -m pip install --upgrade pip setuptools wheel
          # .gitlab-ci.yml publish: torch + ciupload + hcusmi from the DTK nightly index
          python3 -m pip install "torch==${TORCH_VERSION}" ciupload hcusmi
          # Generic deps from the public mirror, as in .gitlab-ci.yml
          python3 -m pip install -r requirements.txt -r requirements-dev.txt \
            -i https://mirrors.aliyun.com/pypi/simple/ \
            --trusted-host mirrors.aliyun.com
          # No toolchain / git label: the version suffix is added by CIUpload REPAIR.
          NO_TOOLCHAIN_VERSION=1 NO_GIT_VERSION=1 bash das-build.sh
          ls -l dist/
          test -n "$(ls -1 dist/*.whl)"

      - name: Repair wheel
        run: |
          set -eo pipefail
          rm -rf output
          # .gitlab-ci.yml publish: CIUpload REPAIR appends
          # +dtk<dtk>.torch<torch>.<timestamp>.g<commit> and pins torch==<torch>.
          CIUpload REPAIR \
            --dtk_version "${DTK_VER}" \
            --torch_version "${TORCH_VERSION}" \
            --git_commit "$(git rev-parse --short=6 HEAD)" \
            --outputdir output \
            -f dist/*.whl
          ls -l output/
          test -n "$(ls -1 output/*.whl)"

      - name: Upload nightly wheel
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          HCU_DEVPI_NIGHTLY_PASSWORD: ${{ secrets.HCU_DEVPI_NIGHTLY_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          : "${HCU_DEVPI_NIGHTLY_PASSWORD:?HCU_DEVPI_NIGHTLY_PASSWORD repository secret is required}"
          record_flag="--record"
          if [[ "${HCU_PUBLISH_RECORD:-1}" == "0" ]]; then
            record_flag="--no_record"
          fi
          # .gitlab-ci.yml publish: upload to das_nightly/dtk${DTK_VER} and
          # record the release (recording failures are warnings only).
          CIUpload NIGHTLY \
            --devpi_url "${PYPI_URL}" \
            --dtk_version "${DTK_VER}" \
            --password "${HCU_DEVPI_NIGHTLY_PASSWORD}" \
            --repo "${GITHUB_WORKSPACE}" \
            ${record_flag} \
            -f output/*.whl

      - name: Upload wheel artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: tilelang-hcu-dtk${{ matrix.dtk_series }}-torch${{ matrix.torch_version }}
          path: |
            dist/*.whl
            output/*.whl
          if-no-files-found: warn
          retention-days: 30

      - name: Write job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### HCU publish — dtk${DTK_VER} / torch ${TORCH_VERSION}"
            echo ""
            echo "| stage | wheel |"
            echo "| --- | --- |"
            for f in dist/*.whl output/*.whl; do
              [[ -f "$f" ]] || continue
              echo "| ${f%%/*} | \`$(basename "$f")\` |"
            done
          } >> "${GITHUB_STEP_SUMMARY}"

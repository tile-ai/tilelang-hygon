# Hygon HCU wheel 构建归档 (main 分支): 只编译并归档到 GitHub Actions artifact,
# 不做 CIUpload, 不往内网 devpi 发包。
#
#   push main -> 编译 wheel -> 归档 artifact
#
# release 分支的发版见 release-pypi-hcu.yml
# (两边的打包矩阵需保持一致)
#
# 变量按组织级配置: PYPI_URL / HARBOR_SITE / RESOURCE_SERVER_URL
name: build-hcu

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYPI_URL: ${{ vars.PYPI_URL }}

jobs:
  compile:
    concurrency:
      group: hcu-build-${{ github.ref }}-dtk${{ matrix.dtk_version }}-torch${{ matrix.torch_version }}-py${{ matrix.py_version }}
      cancel-in-progress: true
    runs-on: hygon-build
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # 打包组合: 26.10 x torch 2.11.0 / 2.13.0, 26.04 x torch 2.11.0, 27.04 x torch 2.13.0
      matrix:
        include:
          - dtk_version: "26.10"
            torch_version: "2.11.0"
            py_version: "3.12"
          - dtk_version: "26.10"
            torch_version: "2.13.0"
            py_version: "3.12"
          - dtk_version: "26.04"
            torch_version: "2.11.0"
            py_version: "3.10"
          - dtk_version: "27.04"
            torch_version: "2.13.0"
            py_version: "3.12"
    env:
      TORCH_VERSION: ${{ matrix.torch_version }}
      DTK_VERSION: ${{ matrix.dtk_version }}
    container:
      # DTK 装在镜像里, 自带 /opt/dtk
      image: ${{ vars.HARBOR_SITE }}/hcu/base/dtk:${{ matrix.dtk_version }}-rockylinux8.6-py${{ matrix.py_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 配置 pip 源
        shell: bash
        run: |
          {
            echo "PIP_INDEX_URL=${PYPI_URL}/nightly/dtk${DTK_VERSION//./}/+simple/"
            echo "PIP_TRUSTED_HOST=${PYPI_URL#*://}"
          } >> "${GITHUB_ENV}"

      - name: 安装 AICC
        shell: bash
        run: |
          wget ${{ vars.RESOURCE_SERVER_URL }}/ai_cc/Nightly/hcu_llvm_installer.sh
          bash hcu_llvm_installer.sh
        env:
          RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL }}

      - name: 安装 torch (编译前置依赖)
        shell: bash
        run: pip install --no-cache-dir torch==${TORCH_VERSION}

      - name: 编译 wheel
        shell: bash
        run: |
          source /opt/dtk/env.sh
          # 不带 toolchain/git 版本标签, 产出的就是 VERSION 里的干净版本
          NO_TOOLCHAIN_VERSION=1 NO_GIT_VERSION=1 bash das-build.sh

      - name: 归档 wheel
        uses: actions/upload-artifact@v4
        with:
          name: tilelang-hcu-dtk${{ matrix.dtk_version }}-torch${{ matrix.torch_version }}-py${{ matrix.py_version }}
          path: dist/*.whl
          if-no-files-found: error

      - name: 清理 workspace
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* || true
